# Gates for the four released crates: o1-contract, o1-core, o1-sync, o1-predict.
# o1-linux, the o1 façade, tools/ and the research tools outside the workspace are not built
# here. No publication authority: read-only token, no id-token, no secrets.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CRATES: -p o1-contract -p o1-core -p o1-sync -p o1-predict

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Every target builds
        run: cargo check $CRATES --all-targets
      - name: Unit, integration, property and doc tests (default features)
        run: cargo test $CRATES
      - name: Same with every feature (o1-sync access-counting, o1-predict serde)
        run: cargo test $CRATES --all-features

  compile-fail-codes:
    # Stable rustdoc runs compile_fail doc-tests without checking their error codes; nightly
    # rustdoc checks them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test $CRATES --doc

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --check $CRATES
      - name: Clippy is warning-free
        run: cargo clippy $CRATES --all-targets --all-features -- -D warnings
      - name: Public documentation is warning-free
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc $CRATES --no-deps --all-features

  msrv:
    # The libraries build on 1.85. The test suite does not: proptest 1.12 needs 1.88 and
    # criterion 0.8 needs 1.86, so tests run on stable only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          targets: thumbv7em-none-eabihf
      - run: cargo check $CRATES
      - run: cargo check $CRATES --target thumbv7em-none-eabihf
      - run: cargo check -p o1-predict --features serde --target thumbv7em-none-eabihf

  no-std:
    # thumbv7em-none-eabihf: no OS, no allocator, no 64-bit atomics.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - run: cargo check $CRATES --target thumbv7em-none-eabihf
      - run: cargo check -p o1-predict --features serde --target thumbv7em-none-eabihf
      - run: cargo check $CRATES --target wasm32-unknown-unknown

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: SPSC orderings, all interleavings of the four models
        env:
          RUSTFLAGS: --cfg loom
        run: cargo test -p o1-sync --release --lib

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Strict provenance, Stacked Borrows (property tests at 8 cases)
        env:
          PROPTEST_CASES: "8"
          # proptest's failure persistence calls getcwd, which isolation forbids.
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation
        run: cargo miri test --no-fail-fast -p o1-contract -p o1-core -p o1-sync

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Archive contents
        run: |
          for c in o1-contract o1-core o1-sync o1-predict; do
            echo "== $c"
            cargo package --list -p "$c"
          done
      - name: Build and verify all four archives together
        # Packaging the four in one call verifies the dependants against the packaged
        # o1-contract (a temporary local registry), so this works before o1-contract is on
        # crates.io. A registry dry run of a dependant only works once the o1-contract version
        # it requires is published; release.yml checks that before publishing one.
        run: cargo package $CRATES
      - name: Registry dry run of o1-contract (skipped once its version is on crates.io)
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "o1-contract") | .version')
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "github.com/${GITHUB_REPOSITORY} CI" "https://crates.io/api/v1/crates/o1-contract/$version")
          case "$status" in
            200) echo "o1-contract $version is already on crates.io; no dry run." ;;
            404) cargo publish --dry-run -p o1-contract ;;
            *) echo "crates.io answered $status for o1-contract $version"; exit 1 ;;
          esac
