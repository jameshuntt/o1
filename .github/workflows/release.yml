# Publishes exactly one crate per tag to crates.io through Trusted Publishing.
# Tag `<crate>-v<version>` for one of o1-contract, o1-core, o1-sync, o1-predict. Nothing else
# triggers this workflow and nothing else can publish. No version is bumped here: the tag must
# name the version already committed in the crate's manifest and changelog. A tag whose version
# is already on crates.io (the hand-published first release) runs the same checks and the
# Trusted Publishing exchange, and publishes nothing.
name: Release

on:
  push:
    tags:
      - "o1-contract-v*"
      - "o1-core-v*"
      - "o1-sync-v*"
      - "o1-predict-v*"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      crate: ${{ steps.tag.outputs.crate }}
      version: ${{ steps.tag.outputs.version }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Tag names a released crate at its committed, unpublished version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            o1-contract-v*) crate=o1-contract ;;
            o1-core-v*) crate=o1-core ;;
            o1-sync-v*) crate=o1-sync ;;
            o1-predict-v*) crate=o1-predict ;;
            *) echo "tag '$TAG' does not name one of o1-contract, o1-core, o1-sync, o1-predict"; exit 1 ;;
          esac
          version=${TAG#"$crate"-v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag '$TAG': '$version' is not a version"; exit 1
          fi
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
          if [ "$version" != "$manifest" ]; then
            echo "tag '$TAG' says $version, crates/$crate/Cargo.toml says $manifest"; exit 1
          fi
          escaped=$(printf '%s' "$version" | sed 's/[.]/\\./g')
          if ! grep -Eq "^## ${escaped} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" "crates/$crate/CHANGELOG.md"; then
            echo "crates/$crate/CHANGELOG.md has no '## $version (YYYY-MM-DD)' entry"; exit 1
          fi
          on_crates_io() {
            curl -s -o /dev/null -w '%{http_code}' -A "github.com/${GITHUB_REPOSITORY:-o1} release check" \
              "https://crates.io/api/v1/crates/$1/$2"
          }
          status=$(on_crates_io "$crate" "$version")
          case "$status" in
            404) echo "$crate $version is not on crates.io yet; it will be published"; publish=true ;;
            200) echo "$crate $version is already on crates.io; nothing will be published"; publish=false ;;
            *) echo "crates.io answered $status for $crate $version"; exit 1 ;;
          esac
          if [ "$crate" != o1-contract ]; then
            req=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .dependencies[]
                  | select(.name == "o1-contract" and .kind == null) | .req')
            need=${req#^}
            need=${need#=}
            status=$(on_crates_io o1-contract "$need")
            case "$status" in
              200) echo "$crate requires o1-contract $req; $need is on crates.io" ;;
              404) echo "$crate requires o1-contract $req; publish o1-contract $need first"; exit 1 ;;
              *) echo "crates.io answered $status for o1-contract $need"; exit 1 ;;
            esac
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tests (default features)
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
        run: cargo test -p "$CRATE"
      - name: Tests (all features)
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
        run: cargo test -p "$CRATE" --all-features
      - name: Clippy is warning-free
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
        run: cargo clippy -p "$CRATE" --all-targets --all-features -- -D warnings
      - name: Documentation is warning-free
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p "$CRATE" --no-deps --all-features
      - name: MSRV 1.85 builds the library
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
        run: |
          rustup toolchain install 1.85 --profile minimal
          cargo +1.85 check -p "$CRATE"
      - name: Package builds and verifies against crates.io
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
        run: cargo package -p "$CRATE"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    # One group per crate: GitHub keeps a single waiting job per group and cancels older waiting
    # ones, so a shared group would cancel releases of different crates tagged close together.
    # Ordering between crates is enforced by the dependency check in `verify`.
    concurrency:
      group: crates-io-release-${{ needs.verify.outputs.crate }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish this one crate
        if: needs.verify.outputs.publish == 'true'
        env:
          CRATE: ${{ needs.verify.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p "$CRATE"
      - name: Already published
        if: needs.verify.outputs.publish != 'true'
        env:
          CRATE: ${{ needs.verify.outputs.crate }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: echo "$CRATE $VERSION is already on crates.io. The Trusted Publishing exchange above succeeded; nothing was published."
