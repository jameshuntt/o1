[workspace]
resolver = "3"
members = [
    "crates/o1-contract",
    "crates/o1-core",
    "crates/o1-sync",
    "crates/o1-linux",
    "crates/o1",
    "crates/o1-predict",
    "tools/xtask",
    "tools/codegen-probe",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
authors = ["James Hunt <james@1o.business>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jameshuntt/o1"
homepage = "https://github.com/jameshuntt/o1"

[workspace.dependencies]
o1-contract = { version = "0.1.0", path = "crates/o1-contract" }
o1-core = { version = "0.1.0", path = "crates/o1-core" }
o1-sync = { version = "0.1.0", path = "crates/o1-sync" }
o1-linux = { path = "crates/o1-linux" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
loom = "0.7.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "warn"

[profile.bench]
debug = false
