[package]
name = "o1-sync"
description = "Allocation-free bounded synchronisation: a fixed-capacity SPSC ring whose push and pop are wait-free, and cache-line padding."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/o1-sync"
keywords = ["spsc", "ring-buffer", "wait-free", "queue", "no-std"]
categories = ["concurrency", "no-std", "no-std::no-alloc", "data-structures"]

[features]
# Verification tooling only (needs std): per-thread counts of the SPSC ring's atomic accesses
# and slot accesses. Off by default; never for production.
access-counting = []

[dependencies]
o1-contract.workspace = true

[target.'cfg(loom)'.dependencies]
loom.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[lints]
workspace = true

[[bench]]
name = "spsc"
harness = false
