[package]
name = "o1-predict"
description = "Operation-class time prediction from calibration evidence: exact class matching, no extrapolation, an interval with its evidence or a machine-readable refusal. no_std + alloc, no unsafe."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/o1-predict"
keywords = ["prediction", "calibration", "interval", "refusal", "no-std"]
categories = ["no-std"]

[features]
# Serialize / deserialize every public type except the validation errors `KeyError`,
# `GeometryError` and `EvidenceError` (derives only; `alloc`, no `std`).
serde = ["dep:serde"]

[dependencies]
o1-contract.workspace = true
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["serde"]
